services:
  postgres:
    image: postgres:16-alpine
    container_name: moviedb-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-moviedb}
      POSTGRES_USER: ${DB_USER:-movieuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD?Database password required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-movieuser} -d ${DB_NAME:-moviedb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: moviedb-ml
    volumes:
      - ./artifacts:/app/artifacts:ro
    environment:
      - MODEL_PATH=/app/artifacts
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: moviedb-gateway
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - GATEWAY_PORT=4000
      - DATABASE_URL=postgresql://${DB_USER:-movieuser}:${DB_PASSWORD?Database password required}@postgres:5432/${DB_NAME:-moviedb}
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=${JWT_SECRET?JWT Secret required}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moviedb-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  app-net:
    driver: bridge
