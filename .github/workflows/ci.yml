name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Test Docker Compose Build
        env:
          DB_PASSWORD: test-password
          JWT_SECRET: test-secret
        run: docker compose build